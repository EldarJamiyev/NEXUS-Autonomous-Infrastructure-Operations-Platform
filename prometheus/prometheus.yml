global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    site: corp-nexus-lab

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: nexus
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["nexus:8000"]
        labels:
          environment: simulation
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
