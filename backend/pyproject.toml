[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-omnis"
version = "0.1.0"
description = "NEXUS OMNIS - infrastructure operations control plane prototype (simulation-first)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eldar Jamiyev" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30,<2.2",
  "alembic>=1.13,<2.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "rich>=13.7",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML>=6.0", "pip-audit>=2.7"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
nexusctl = "nexus.cli.main:main"
nexus-server = "nexus.server:main"

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.setuptools.package-data]
nexus = ["remediation/catalog.yaml", "database/migrations/env.py", "database/migrations/script.py.mako", "database/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["nexus/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311", "S603", "S607", "B008", "S104", "E501", "UP017", "SIM108", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
disallow_untyped_defs = false
exclude = ["nexus/database/migrations/"]
