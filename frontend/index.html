<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="NEXUS OMNIS - infrastructure operations control plane (prototype, simulation environment)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>NEXUS OMNIS</title>
    <script>
      {
        const scheme = localStorage.getItem("nexus-color-scheme");
        if (scheme) {
          document.querySelector('meta[name="color-scheme"]').content = scheme;
          document.documentElement.dataset.theme = scheme;
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
