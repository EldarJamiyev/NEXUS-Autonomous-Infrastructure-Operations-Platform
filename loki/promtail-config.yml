server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: nexus
    static_configs:
      - targets: [localhost]
        labels:
          job: nexus
          __path__: /data/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            ts: timestamp
      - labels:
          level:
          logger:
      - timestamp:
          source: ts
          format: RFC3339Nano
